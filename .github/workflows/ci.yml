name: Hubora CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:static
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-smoke:
    name: browser-smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Os contratos E2E usam os adaptadores reais. As chaves entram apenas no
    # processo do runner e nunca são expostas ao bundle, aos logs ou ao Git.
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Functional flows are exercised once in the desktop browser. Visual
          # and automated a11y coverage are then repeated at each breakpoint;
          # running every real-provider flow three times was exceeding the CI
          # window without adding distinct behaviour coverage.
          - name: desktop-regression
            command: "npm run test:e2e -- --project=desktop-chromium --grep-invert='evidência visual|não tem violações WCAG automatizáveis|atalho de conteúdo'"
          - name: desktop-visual-a11y
            command: 'npm run test:e2e -- tests/e2e/visual-routes.spec.ts tests/e2e/accessibility.spec.ts --project=desktop-chromium'
          - name: tablet-visual-a11y
            command: 'npm run test:e2e -- tests/e2e/visual-routes.spec.ts tests/e2e/accessibility.spec.ts --project=tablet-chromium'
          - name: android-visual-a11y
            command: 'npm run test:e2e -- tests/e2e/visual-routes.spec.ts tests/e2e/accessibility.spec.ts --project=android-chromium'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:static
      - run: npx playwright install --with-deps chromium
      - name: Install authorized E2E media generator
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run build
      - run: ${{ matrix.command }}
